name: Deploy mobile import page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble privacy-friendly static site
        run: |
          mkdir -p site/mobile site/lib site/vendor
          cp mobile/* site/mobile/
          cp lib/schedule-core.js lib/mobile-payload.js site/lib/
          cp vendor/lz-string.min.js site/vendor/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
